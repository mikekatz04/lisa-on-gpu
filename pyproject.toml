[build-system]
# Phase 3L.7n (2026-06-04): fastlisaresponse is now a pure-Python wheel.
# All C++/CUDA build deps (Cython, numpy, nanobind, gpubackendtools,
# lisaanalysistools, gbgpu) dropped -- the CMake project is LANGUAGES NONE
# and there's nothing to compile. scikit_build_core stays so the existing
# wheel.packages / metadata.version config keeps working through the
# deprecation window; Phase 3L.7o retires the package outright.
requires = [
  "scikit_build_core",
]
build-backend = "scikit_build_core.build"

[project]
name = "fastlisaresponse" #@NAMESUFFIX@

description = "GPU-accelerated LISA Response Function"

authors = [
  { name = "Michael Katz", email = "mikekatz04@gmail.com" },
]
readme = "README.md"

requires-python = ">= 3.10"

dependencies = [
  # Phase 3L.7n (2026-06-04): runtime deps trimmed to nothing. The
  # package's only Python content is __init__.py (deprecation notice),
  # _version.py / _editable.py (packaging hooks), and
  # cutils/__init__.py (retirement-notice docstring). It depends on
  # nothing at runtime -- users get a DeprecationWarning on import
  # pointing at lisatools.response / gbgpu / bbhx.
]


classifiers = [
  # Phase 3L.7n (2026-06-04): dropped "Environment :: GPU :: NVIDIA CUDA"
  # / "Programming Language :: C++" / "Programming Language :: Cython"
  # since the wheel no longer ships native code.
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dynamic = [ "version" ]

optional-dependencies.doc = [
  "ipykernel",
  "ipython",
  "ipywidgets",
  "myst-parser",
  "nbsphinx",
  "pypandoc",
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-tippy",
  "astropy",
]

optional-dependencies.sampling = [
  "eryn",
  "astropy",
]

optional-dependencies.testing = [
  "matplotlib",
  "astropy",
  "lisaanalysistools",
  "gpubackendtools",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
version_file = "src/fastlisaresponse/_version.py"
#@FALLBACK_VERSION@

[tool.scikit-build]
wheel.packages = ["src/fastlisaresponse"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = [
  "src/fastlisaresponse/_version.py",
  "tests/"
  # Phase 3L.7n (2026-06-04): dropped git_version.py +
  # src/fastlisaresponse_backend_cuda{11x,12x,13x}/git_version.py since
  # the backend wheels no longer exist.
]
sdist.exclude = [
  ".devcontainer/",
  ".github/",
  "dataset-preprocessing/",
  "docs/",
  "examples/",
  ".cmake-format.yaml",
  ".gitignore",
  ".pre-commit-config.yaml",
  "src/fastlisaresponse/_editable.py",
  "tests/base.py",
]

wheel.exclude = [
  # Phase 3L.7n (2026-06-04): native sources no longer in the tree, but
  # keep the exclusions so a leftover .so/.cu/.cxx from a stale checkout
  # doesn't sneak into the wheel.
  "**.pyx",
  "**.cu",
  "**.cxx",
  "**.hh",
  "**.h",
  "**.hpp",
  "**/CMakeLists.txt",
  "lib/pkgconfig",
  "lib/cmake",
  "lib/*.so",
  "lib/*.a",
]

[tool.pyproject-fmt]
max_supported_python = "3.13"

[tool.coverage]
paths.source = [
  "src/",
  "**/site-packages/",
]

report.omit = [
  "*/fastlisaresponse/_version.py",
  "*/fastlisaresponse/tests/*.py",
  "*/fastlisaresponse/git_version.py",
  "*/fastlisaresponse_backend_*/git_version.py",
]
